[package]
name = "i18n"
version = "0.1.0"
alya-version = "0.0.19"
entry = "src/lib.alya"
description = "Lightweight internationalization: locale bundles, gettext-style .tr and JSON loaders, CLDR-lite plurals"
authors = ["Alya Language Contributors <https://github.com/alya-lang>"]
license = "MIT"
homepage = "https://github.com/alya-lang/alya"
repository = "https://github.com/alya-lang/i18n"
keywords = ["alya", "alya-lang", "package", "i18n", "locale", "l10n"]

[dependencies]
json = { git = "https://github.com/alya-lang/json", tag = "v0.1.0" }
toml = { git = "https://github.com/alya-lang/toml", tag = "v0.1.0" }
yaml = { git = "https://github.com/alya-lang/yaml", tag = "v0.1.0" }
sysinfo = { git = "https://github.com/alya-lang/sysinfo", tag = "v0.1.0" }

